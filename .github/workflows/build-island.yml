name: Build & Release LastWave

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Sign APK (Self-Signed)
        run: |
          keytool -genkeypair -v -keystore release.jks -alias lastwave \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=LastWave, OU=Fork, O=App, L=Local, S=State, C=IN"

          APK_UNSIGNED=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks release.jks \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out LastWave-OriginIsland.apk \
            "$APK_UNSIGNED"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: LastWave OriginIsland v${{ github.run_number }}
          draft: false
          prerelease: false
          files: LastWave-OriginIsland.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
