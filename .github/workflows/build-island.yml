name: Build Spotify LastWave

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: Clash-Projects/LastWave-Native
          fetch-depth: 0

      - name: Checkout Latest Official Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view -R Clash-Projects/LastWave-Native --json tagName -q .tagName)
          echo "Checking out official release tag: $TAG"
          git checkout "$TAG"

      - name: Set Spotify Package Name & Disable Signing Check
        run: |
          sed -i 's/applicationId = "com.lastwave.app"/applicationId = "com.spotify.music"/g' app/build.gradle.kts
          sed -i 's/signingConfig = signingConfigs/ \/\/ signingConfig = signingConfigs/g' app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Align and Sign APK
        run: |
          keytool -genkeypair -v -keystore release.jks -alias lastwave \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=LastWave, OU=Fork, O=App, L=Local, S=State, C=IN"

          APK_RAW=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)

          # Align APK to 4-byte boundaries (Fixes "package appears to be invalid")
          $ANDROID_HOME/build-tools/35.0.0/zipalign -v -p 4 "$APK_RAW" aligned.apk

          # Sign the aligned APK
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks release.jks \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out LastWave-Spotify.apk \
            aligned.apk

      - name: Upload APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-spotify
          name: LastWave Spotify Origin v${{ github.run_number }}
          draft: false
          prerelease: false
          files: LastWave-Spotify.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
